  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

  @media print{

    .drawer{position:static;transform:none;width:100%;box-shadow:none;background:#fff;height:auto}

</style>
</head>

// Demo persistence: sessionStorage only, so a refresh of the tab restores the
// seeded state and nothing leaks between browsers.
function save(){
  try { sessionStorage.setItem("jv_demo", JSON.stringify({ rows, clients })); } catch(_){}
}
function restore(){
  try {
    const raw = sessionStorage.getItem("jv_demo");
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.rows || !d.clients) return false;
    rows = d.rows; clients = d.clients;
    return true;
  } catch(_){ return false; }
}
function resetDemo(){
  if(!confirm("Reset the demo back to its sample data?")) return;
  sessionStorage.removeItem("jv_demo");
  seed(); closeDrawer(); closeModal(); renderAll();
}

function init(){
  if(!restore()) seed();
  document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeDrawer(); closeModal(); toggleSidebar(false); } });
  setView("dashboard");
  renderAll();
}

// ---- navigation -------------------------------------------------------------
function setView(vw){
  view = vw;
  document.querySelectorAll(".nav").forEach(n => n.classList.toggle("active", n.dataset.view === vw));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "v-"+vw));
  toggleSidebar(false);
  if(vw === "calendar") renderCalendar();
  if(vw === "clients") renderClients();
}
function toggleSidebar(open){
  el("sidebar").classList.toggle("open", open);
  el("scrim").classList.toggle("open", open);
}
function setFilter(btn){
  document.querySelectorAll("#v-appointments .tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  filter = btn.dataset.filter;
  renderList();
}

function renderAll(){
  counts(); renderUpcoming(); renderNudges(); renderList();
  if(view === "clients") renderClients();
  if(view === "calendar") renderCalendar();
  save();
}
function counts(){
  const p = rows.filter(r => r.status === "pending").length;
  const c = rows.filter(r => r.status === "confirmed").length;
  el("c-pending").textContent = p ? "("+p+")" : "";

function clientBookings(cid){
  return rows.filter(r => r.client_id === cid)
             .sort((a,b) => (b.appt_date||"").localeCompare(a.appt_date||""));
}
function visitStats(cid){
  const bs = rows.filter(r => r.client_id === cid);
  const completed = bs.filter(r => r.status === "completed");
  const noShows   = bs.filter(r => r.status === "no_show").length;
  const dates = completed.map(r => r.appt_date).filter(Boolean).sort();
  return { total: completed.length, requests: bs.length, noShows,
           first: dates[0] || null, last: dates[dates.length-1] || null };
}

function renderNudges(){
  const t = todayStr(), out = [];
  Object.values(clients).forEach(p => {
    if(p.last_seen && daysBetween(p.last_seen, t) >= 90){
      out.push('<div class="nudge nudge-stale"><span class="ntag ntag-stale">Follow-up</span><div>'+
        '<strong class="nm" onclick="openDrawer(\''+p.id+'\')">'+esc(p.full_name)+'</strong>'+
        ', last seen '+daysBetween(p.last_seen,t)+' days ago.</div></div>');
    }
    if(p.dob){
      const dob = new Date(p.dob+"T00:00:00"), now = new Date(t+"T00:00:00");
      let next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
      if(next < now) next = new Date(now.getFullYear()+1, dob.getMonth(), dob.getDate());
      const dd = daysBetween(t, dstr(next));
      if(dd >= 0 && dd <= 7){
        out.push('<div class="nudge nudge-bday"><span class="ntag ntag-bday">Birthday</span><div>'+
          '<strong class="nm" onclick="openDrawer(\''+p.id+'\')">'+esc(p.full_name)+'</strong>'+
          ', '+(dd===0?'today':'in '+dd+' day'+(dd===1?'':'s'))+'.</div></div>');
      }
    }
  });
  el("nudges").innerHTML = out.length ? '<div class="card" style="padding:14px">'+out.join("")+'</div>' : '';
}

// ---- Calendar ---------------------------------------------------------------
function calMove(delta){ calCursor.setMonth(calCursor.getMonth()+delta); renderCalendar(); }
function renderCalendar(){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  el("calLabel").textContent = calCursor.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const t = todayStr();
  const byDate = {};
  rows.filter(r => ["confirmed","completed","pending"].includes(r.status)).forEach(r => {
    (byDate[r.appt_date] = byDate[r.appt_date] || []).push(r);
  });
  const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => '<div class="dow">'+d+'</div>').join("");
  let cells = "";
  for(let i=0;i<first;i++) cells += '<div class="cell empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = y+"-"+pad(m+1)+"-"+pad(d);
    const closed = new Date(y,m,d).getDay() === CLOSED_DOW;
    const evs = (byDate[ds]||[]).sort((a,b)=>String(a.appt_time).localeCompare(String(b.appt_time))).map(r =>
      '<div class="ev" title="'+attr(r.appt_time+' · '+r.client_name+' · '+r.service_name)+'"'+
      (r.client_id?' onclick="openDrawer(\''+r.client_id+'\')"':'')+'>'+
      esc(String(r.appt_time).replace(/:00/,""))+' '+esc((r.client_name||"").split(" ")[0])+'</div>'
    ).join("");
    cells += '<div class="cell'+(ds===t?' today':'')+(closed?' closed':'')+'"><div class="dn">'+d+'</div>'+
             (closed && !evs ? '<div class="cl">Closed</div>' : '')+evs+'</div>';
  }
  el("calGrid").innerHTML = '<div class="cal">'+dow+cells+'</div>';
}

  openClientId = cid;
  const p = clients[cid];
  el("drawerBody").innerHTML = p ? drawerHtml(p) : '<div style="color:#6E7A73">Client file not found.</div>';
  el("overlay").classList.add("open");
  el("drawer").classList.add("open");
}
function closeDrawer(){
  openClientId = null;
  el("overlay").classList.remove("open");
  el("drawer").classList.remove("open");
}
function refreshDrawer(){ if(openClientId && clients[openClientId]) el("drawerBody").innerHTML = drawerHtml(clients[openClientId]); }

function drawerHtml(p){
  const st = visitStats(p.id);
  const bs = clientBookings(p.id);
  const age = p.dob ? Math.floor(daysBetween(p.dob, todayStr())/365.25) : null;

  let alert = "";
  if(p.allergies || p.avoid_areas){
    const bits = [];
    if(p.allergies)   bits.push('<strong>ALLERGIES</strong> &nbsp;'+esc(p.allergies));
    if(p.avoid_areas) bits.push('<strong>AVOID</strong> &nbsp;'+esc(p.avoid_areas));
    alert = '<div class="alert" style="margin-top:16px;flex-direction:column;gap:5px">'+bits.map(b=>'<div>'+b+'</div>').join("")+'</div>';
  }

  const pts = painTrend(p.id);
  const trend = pts.length
    ? '<div style="margin-top:14px;font-size:13px;color:#6E7A73"><strong style="color:#4A5A53">Pain trend (0–10):</strong> '+
      pts.map((n,i)=>'<span class="pain" style="background:'+painBg(n)+';color:'+painColor(n)+'">'+n+'</span>'+(i<pts.length-1?' <span style="color:#C9C0B2">→</span> ':'')).join('')+'</div>'
    : '';

  const tags = (p.tags||[]).map(t =>
    '<span class="tag">'+esc(t)+'<button title="Remove" onclick="removeTag(\''+p.id+'\',\''+esc(t)+'\')">×</button></span>'
  ).join("");
  const addable = KNOWN_TAGS.filter(t => !(p.tags||[]).includes(t))
    .map(t => '<button class="chip" onclick="addTag(\''+p.id+'\',\''+esc(t)+'\')">+ '+esc(t)+'</button>').join("");

  const timeline = bs.map(visitCard).join("")
    || '<div style="color:#8A9089;font-size:13.5px;padding:8px 0">No visits on record yet.</div>';

  return ''+
  '<div class="no-print" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">'+
    '<button class="btn btn-ghost btn-sm" onclick="closeDrawer()">‹ Back</button>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn btn-teal btn-sm" onclick="openApptForm(\''+p.id+'\')">+ Appointment</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="window.print()">Print / PDF</button>'+
    '</div>'+
  '</div>'+

  '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px">'+
    '<div class="serif" style="font-size:27px;font-weight:300">'+esc(p.full_name)+'</div>'+
    '<span style="font-size:12.5px;font-weight:700;color:#8A9089">File #'+esc(p.file_no||'-')+'</span>'+
  '</div>'+
  '<div style="font-size:13px;color:#6E7A73;margin-top:3px">'+
    (age!=null?age+' yrs':'')+(p.sex?(age!=null?' · ':'')+esc(p.sex):'')+(p.pressure?' · prefers '+esc(p.pressure).toLowerCase()+' pressure':'')+
  '</div>'+
  alert+

  '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">'+
    '<div class="stat"><div class="n">'+st.total+'</div><div class="l">Visits</div></div>'+
    '<div class="stat"><div class="n">'+(st.last?esc(fmtDate(st.last,true)):'-')+'</div><div class="l">Last seen</div></div>'+
    '<div class="stat"><div class="n">'+(st.first?esc(fmtDate(st.first,true)):'-')+'</div><div class="l">First seen</div></div>'+
    '<div class="stat"><div class="n">'+st.noShows+'</div><div class="l">No-shows</div></div>'+
  '</div>'+
  trend+

  '<div class="seclabel">Flags</div>'+
  '<div style="display:flex;gap:6px;flex-wrap:wrap">'+(tags||'<span style="font-size:13px;color:#8A9089">None</span>')+'</div>'+
  (addable ? '<div class="no-print" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+addable+'</div>' : '')+

  '<div class="seclabel">Safety &amp; intake</div>'+
  pfArea(p.id,'Allergies / oil sensitivities','allergies','None known')+
  pfArea(p.id,'Areas to avoid','avoid_areas','Injuries, recent surgery, pregnancy restrictions…')+
  pfArea(p.id,'Intake notes','intake','What they came in for, work, activity…')+
  '<div class="grid2">'+
    pfSel(p.id,'Pressure preference','pressure',PRESSURE_OPTS)+
    pfText(p.id,'Referred by','referred_by')+
  '</div>'+

  '<div class="seclabel">Health background</div>'+
  pfArea(p.id,'Current medications','medications','None')+
  pfArea(p.id,'Medical history','medical_history','Past conditions, surgeries, injuries…')+

  '<div class="seclabel">Details</div>'+
  '<div class="grid2">'+
    pfText(p.id,'Full name','full_name')+
    pfText(p.id,'Date of birth','dob','date')+
    pfSel(p.id,'Sex','sex',SEX_OPTS)+
    pfText(p.id,'Phone','phone','tel')+
    pfText(p.id,'Email','email','email')+
    pfText(p.id,'File #','file_no')+
  '</div>'+
  pfArea(p.id,'Address','address')+
  pfText(p.id,'Emergency contact','emergency_contact')+

  '<div class="seclabel">Insurance</div>'+
  '<div class="grid2">'+
    pfText(p.id,'Provider','insurance_provider')+
    pfText(p.id,'Member ID','insurance_member_id')+
  '</div>'+
  '<div style="font-size:12px;color:#8A9089;margin-top:-4px">JV Massage is a non-RMT wellness practice — kept for the client\'s own records only.</div>'+

  '<div class="seclabel">Standing notes</div>'+
  pfArea(p.id,'','client_notes','Preferences, room setup, how they like to be treated…')+

  '<div class="seclabel">Visit history &amp; session notes</div>'+
  timeline+

  '<div class="no-print" style="margin-top:28px;padding-top:16px;border-top:1px solid #E9DDD8">'+
    '<button class="btn btn-red btn-sm" onclick="deleteClient(\''+p.id+'\')">Delete client</button>'+
    '<div style="font-size:11.5px;color:#8A9089;margin-top:7px">Removes this file and its visit records from the demo.</div>'+
  '</div>';
}

function visitCard(b){
  const complaint = b.chief_complaint ? ' · '+esc(b.chief_complaint) : '';
  const painBadge = b.pain_level!=null
    ? '<span class="pain" style="background:'+painBg(b.pain_level)+';color:'+painColor(b.pain_level)+'">Pain '+b.pain_level+'</span>' : '';
  return '<details class="visit">'+
    '<summary>'+
      '<span style="font-weight:700;font-size:13.5px;min-width:96px">'+esc(fmtDate(b.appt_date,true))+'</span>'+
      '<span class="pill s-'+esc(b.status)+'">'+esc(b.status.replace("_"," "))+'</span>'+
      '<span class="serif" style="font-size:15px;color:#3E6157;flex:1;min-width:120px">'+esc(b.service_name)+complaint+'</span>'+
      painBadge+
    '</summary>'+
    '<div class="visit-body">'+
      '<div class="grid2">'+
        '<div class="fld"><label>Visit type</label><select onchange="saveBookingField(\''+b.id+'\',\'visit_type\',this.value)">'+optList(VISIT_TYPES,b.visit_type||"")+'</select></div>'+
        '<div class="fld"><label>Pain (0–10)</label><select onchange="saveBookingField(\''+b.id+'\',\'pain_level\',this.value)">'+painOpts(b.pain_level)+'</select></div>'+
      '</div>'+
      '<div class="fld"><label>Chief complaint</label><input value="'+attr(b.chief_complaint||"")+'" onchange="saveBookingField(\''+b.id+'\',\'chief_complaint\',this.value)"></div>'+
      '<div class="fld"><label>Areas worked</label><input placeholder="e.g. lumbar, upper traps" value="'+attr(b.regions_treated||"")+'" onchange="saveBookingField(\''+b.id+'\',\'regions_treated\',this.value)"></div>'+
      '<div class="fld"><label>S: Subjective</label><textarea placeholder="What the client reported…" onchange="saveBookingField(\''+b.id+'\',\'soap_s\',this.value)">'+esc(b.soap_s||"")+'</textarea></div>'+
      '<div class="fld"><label>O: Objective</label><textarea placeholder="What you found — tone, range, tenderness…" onchange="saveBookingField(\''+b.id+'\',\'soap_o\',this.value)">'+esc(b.soap_o||"")+'</textarea></div>'+
      '<div class="fld"><label>A: Assessment</label><textarea placeholder="Your read on it…" onchange="saveBookingField(\''+b.id+'\',\'soap_a\',this.value)">'+esc(b.soap_a||"")+'</textarea></div>'+
      '<div class="fld"><label>P: Plan</label><textarea placeholder="Treatment given, home care, rebooking…" onchange="saveBookingField(\''+b.id+'\',\'soap_p\',this.value)">'+esc(b.soap_p||"")+'</textarea></div>'+
    '</div>'+
  '</details>';
}

// ---- mutations (in-memory) --------------------------------------------------
function setStatus(id, status){
  const r = rows.find(x => x.id === id); if(!r) return;
  r.status = status;
  // Completing a visit updates the client's "last seen" the way a real booking would.
  if(status === "completed" && r.client_id && clients[r.client_id]){
    const c = clients[r.client_id];
    if(!c.last_seen || r.appt_date > c.last_seen) c.last_seen = r.appt_date;
  }
  renderAll(); refreshDrawer();
}
function saveBookingField(id, field, value){
  const r = rows.find(x => x.id === id); if(!r) return;
  r[field] = (value === "") ? null : (field === "pain_level" ? Number(value) : value);
  save();
  if(field === "pain_level") refreshDrawer();
}
function saveClientField(cid, field, value){
  const c = clients[cid]; if(!c) return;
  c[field] = value;
  save();
  if(field === "dob") renderNudges();
  if(field === "full_name" || field === "allergies" || field === "avoid_areas"){ renderClients(); refreshDrawer(); }
}
function addTag(cid, tag){
  const p = clients[cid]; if(!p) return;
  p.tags = Array.from(new Set([...(p.tags||[]), tag]));
  save(); refreshDrawer(); renderClients();
}
function removeTag(cid, tag){
  const p = clients[cid]; if(!p) return;
  p.tags = (p.tags||[]).filter(t => t !== tag);
  save(); refreshDrawer(); renderClients();
}
function deleteClient(cid){
  const p = clients[cid]; if(!p) return;
  const n = clientBookings(cid).length;
  const msg = n
    ? "Delete "+(p.full_name||"this client")+" and their "+n+" booking record"+(n===1?"":"s")+"?"
    : "Delete "+(p.full_name||"this client")+"?";
  if(!confirm(msg)) return;
  rows = rows.filter(r => r.client_id !== cid);
  delete clients[cid];
  closeDrawer(); renderAll();
}

// Turn a walk-in/public booking that has no file yet into a real client record.
function createClientFrom(bid){
  const r = rows.find(x => x.id === bid); if(!r) return;
  const nums = Object.values(clients).map(c => Number(c.file_no)||0);
  const next = String(Math.max(1040, ...nums) + 1);
  const c = { id: uid(), full_name: r.client_name, file_no: next, phone: r.phone||"", email: r.email||"",
              dob:"", sex:"", pressure:"", tags:["new"], allergies:"", avoid_areas:"",
              intake: r.notes||"", client_notes:"", medications:"", medical_history:"",
              address:"", emergency_contact:"", insurance_provider:"", insurance_member_id:"",
              referred_by:"", last_seen: r.status==="completed" ? r.appt_date : null };
  clients[c.id] = c;
  rows.filter(x => !x.client_id && x.client_name === r.client_name).forEach(x => { x.client_id = c.id; });
  renderAll(); openDrawer(c.id);
}

function reschedule(id){
  const r = rows.find(x => x.id === id); if(!r) return;
  const date = prompt("New date (YYYY-MM-DD):", r.appt_date);
  if(!date) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ alert("Please use the format YYYY-MM-DD."); return; }
  if(new Date(date+"T00:00:00").getDay() === CLOSED_DOW && !confirm("That's a Tuesday — the studio is normally closed. Schedule anyway?")) return;
  const time = prompt("New time (e.g. 2:00 PM):", r.appt_time);
  if(!time) return;
  rows.unshift(Object.assign({}, r, { id: uid(), created_at: new Date().toISOString(),
    appt_date: date, appt_time: time, status: "confirmed", rescheduled_from: r.id }));
  r.status = "cancelled";
  renderAll();
}

// ---- modals -----------------------------------------------------------------
function openModal(html){ el("modalBody").innerHTML = html; el("modal").classList.add("open"); }
function closeModal(){ el("modal").classList.remove("open"); }

function openAddClient(){
  openModal(
    '<div class="serif" style="font-size:23px;font-weight:300;margin-bottom:4px">New client</div>'+
    '<p style="font-size:13px;color:#6E7A73;margin-bottom:16px">Create the file now — the rest can be filled in after.</p>'+
    '<div class="fld"><label>Full name *</label><input id="np_name" autofocus></div>'+
    '<div class="grid2">'+
      '<div class="fld"><label>Phone</label><input id="np_phone" type="tel"></div>'+
      '<div class="fld"><label>Email</label><input id="np_email" type="email"></div>'+
      '<div class="fld"><label>Date of birth</label><input id="np_dob" type="date"></div>'+
      '<div class="fld"><label>Pressure preference</label><select id="np_pressure">'+optList(PRESSURE_OPTS,"")+'</select></div>'+
    '</div>'+
    '<div class="fld"><label>Allergies / oil sensitivities</label><input id="np_allergies" placeholder="None known"></div>'+
    '<div id="np_err" style="display:none;color:#A2493F;font-weight:500;font-size:13.5px;margin:4px 0"></div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">'+
      '<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>'+
      '<button class="btn btn-teal btn-sm" id="np_save" onclick="createClient()">Create file</button>'+
    '</div>'
  );
}
function createClient(){
  const name = v("np_name");
  if(!name){ el("np_err").textContent = "Please enter the client's name."; el("np_err").style.display="block"; return; }
  const nums = Object.values(clients).map(c => Number(c.file_no)||0);
  const c = { id: uid(), full_name: name, file_no: String(Math.max(1040, ...nums)+1),
              phone: v("np_phone"), email: v("np_email"), dob: v("np_dob"), sex:"",
              pressure: v("np_pressure"), tags:["new"], allergies: v("np_allergies"), avoid_areas:"",
              intake:"", client_notes:"", medications:"", medical_history:"", address:"",
              emergency_contact:"", insurance_provider:"", insurance_member_id:"", referred_by:"", last_seen:null };
  clients[c.id] = c;
  closeModal(); renderAll(); openDrawer(c.id);
}

function openApptForm(prefillCid){
  const plist = Object.values(clients).sort((a,b)=>(a.full_name||"").localeCompare(b.full_name||""));
  const opts = plist.map(p => '<option value="'+p.id+'" '+(p.id===prefillCid?'selected':'')+'>'+esc(p.full_name)+' (#'+esc(p.file_no||'-')+')</option>').join("");
  const svcOpts = SERVICES.map(s => '<option value="'+s.id+'">'+esc(s.name)+'</option>').join("");
  const durOpts = Object.keys(DURATION_PRICE).map(d => '<option value="'+d+'"'+(d==="60"?' selected':'')+'>'+d+' min · $'+DURATION_PRICE[d]+'</option>').join("");
  openModal(
    '<div class="serif" style="font-size:23px;font-weight:300;margin-bottom:14px">New appointment</div>'+
    '<div class="fld"><label>Client</label><select id="ap_client" onchange="toggleApptNew()">'+
      '<option value="__new">+ New client…</option>'+opts+'</select></div>'+
    '<div id="ap_newbox" style="display:'+(prefillCid?'none':'block')+'">'+
      '<div class="grid2">'+
        '<div class="fld"><label>Name *</label><input id="ap_name"></div>'+
        '<div class="fld"><label>Phone</label><input id="ap_phone" type="tel"></div>'+
      '</div>'+
      '<div class="fld"><label>Email</label><input id="ap_email" type="email"></div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="fld"><label>Service</label><select id="ap_service">'+svcOpts+'</select></div>'+
      '<div class="fld"><label>Length</label><select id="ap_dur">'+durOpts+'</select></div>'+
      '<div class="fld"><label>Date</label><input id="ap_date" type="date" value="'+todayStr()+'"></div>'+
      '<div class="fld"><label>Time</label><input id="ap_time" placeholder="e.g. 2:00 PM"></div>'+
      '<div class="fld"><label>Visit type</label><select id="ap_vtype">'+optList(VISIT_TYPES,"")+'</select></div>'+
      '<div class="fld"><label>Status</label><select id="ap_status"><option value="confirmed">Confirmed</option><option value="pending">Pending</option></select></div>'+
    '</div>'+
    '<div id="ap_err" style="display:none;color:#A2493F;font-weight:500;font-size:13.5px;margin:4px 0"></div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">'+
      '<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>'+
      '<button class="btn btn-teal btn-sm" id="ap_save" onclick="createAppointment()">Schedule</button>'+
    '</div>'
  );
  if(prefillCid) el("ap_client").value = prefillCid;
  toggleApptNew();
}
function toggleApptNew(){
  el("ap_newbox").style.display = el("ap_client").value === "__new" ? "block" : "none";
}
function createAppointment(){
  const err = (m)=>{ el("ap_err").textContent = m; el("ap_err").style.display="block"; };
  const sel = el("ap_client").value;
  const date = v("ap_date"), time = v("ap_time");
  if(!date) return err("Pick a date.");
  if(!time) return err("Enter a time.");
  if(new Date(date+"T00:00:00").getDay() === CLOSED_DOW && !confirm("That's a Tuesday — the studio is normally closed. Schedule anyway?")) return;
  const svc = SERVICES.find(s => s.id === v("ap_service")) || SERVICES[0];
  const dur = Number(v("ap_dur")) || 60;

  const rec = { id: uid(), created_at: new Date().toISOString(),
    service_id: svc.id, service_name: svc.name, duration_min: dur, price: DURATION_PRICE[dur] || svc.price,
    appt_date: date, appt_time: time, status: v("ap_status")||"confirmed",
    visit_type: v("ap_vtype")||null, client_id:null, client_name:"", phone:"", email:"",
    pain_level:null, chief_complaint:"", regions_treated:"", soap_s:"", soap_o:"", soap_a:"", soap_p:"", notes:"" };

  if(sel === "__new"){
    const name = v("ap_name");
    if(!name) return err("Enter the new client's name.");
    rec.client_name = name; rec.phone = v("ap_phone"); rec.email = v("ap_email");
  } else {
    const p = clients[sel];
    if(!p) return err("Choose a client.");
    rec.client_id = p.id; rec.client_name = p.full_name; rec.phone = p.phone||""; rec.email = p.email||"";
  }
  rows.unshift(rec);
  closeModal(); renderAll();
  if(sel !== "__new") openDrawer(sel);
}

// ---- date formatting --------------------------------------------------------
function fmtDate(d, short){
  const parts = String(d).split("-");
  if(parts.length !== 3) return d;
  const dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  return dt.toLocaleDateString("en-US", short
    ? {month:"short",day:"numeric"}
    : {weekday:"short",month:"long",day:"numeric"});
}

init();
</script>
