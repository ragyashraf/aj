customHeaders:
  # HTML must always revalidate: asset filenames are not content-hashed, so a
  # cached index.html could otherwise pin visitors to stale markup.
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: X-Frame-Options
        value: 'SAMEORIGIN'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'

  # Images and fonts are immutable in practice; rename the file to bust them.
  - pattern: '/assets/img/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '/assets/fonts/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'

  # JS is vendored and versioned (react 18.3.1) or generated; safe to cache long
  # but kept revalidating weekly so a runtime swap propagates without a rename.
  - pattern: '/assets/js/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
